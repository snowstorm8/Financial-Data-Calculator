<!-- Shared layout for every calculator page. Each page template extends
     this, overriding `title`, `nav_links` (its entry in the nav dropdown,
     duplicated verbatim across pages since Jinja has no shared-partial
     mechanism in use here), and `content` (the form + its inline script). -->
<html>
  <head>
    <title>{% block title %}Financial Calculator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="navbar">
      <a href="/">Home</a>
      <!-- .dropdown-content is shown on hover via CSS only (see style.css);
           no JS is needed to open/close this menu. -->
      <div class="dropdown">
        <button class="dropbtn">Choose
          <i class="fa fa-caret-down"></i>
        </button>
        <div class="dropdown-content">
          {% block nav_links %}{% endblock %}
        </div>
      </div>
    </div>
    {% block content %}{% endblock %}
  </body>
</html>
